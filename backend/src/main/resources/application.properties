# 数据库连接配置
# 说明：原配置把公网服务器地址、库名、账号、密码全部写死，且库名与服务器 IP 同名，
# 不便于本地复现。现改为「环境变量优先、本地默认」的写法：
#   DB_URL / DB_USERNAME / DB_PASSWORD 未设置时，自动使用本地 MySQL 的 cinema 库。
# 本地建库：直接执行 sql/init.sql 即可（已把建表语句与全部演示数据合并成一个脚本），
# 例如：mysql -uroot -p --default-character-set=utf8mb4 < sql/init.sql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinema?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 服务端口
server.port=8080

# 只执行新增表的非破坏性迁移；已有 cinema 演示数据不会被重置。
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/middleware.sql

# Kafka：商城订单的事务事件箱 -> 消息主题 -> 异步订单通知。
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.consumer.group-id=cinema-order-notifications
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:false}
spring.kafka.admin.auto-create=${KAFKA_ENABLED:false}
cinema.kafka.enabled=${KAFKA_ENABLED:false}
cinema.kafka.topic=cinema.order-created

# Memcached 独立负责商品列表；影片列表仍使用 Redis。
memcached.enabled=${MEMCACHED_ENABLED:false}
memcached.servers=${MEMCACHED_SERVERS:localhost:11211}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ==================== Redis 缓存配置 ====================
# 默认连接本机 Redis；Docker 部署时通过 REDIS_HOST=redis 覆盖。
# 缓存只用于加速查询，Redis 不可用时后端会自动降级为直接查数据库，不影响主流程。
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DB:0}
spring.data.redis.timeout=2000ms

# ==================== ZooKeeper 配置 ====================
# 用于选座时的分布式锁，防止两个用户同时买同一个座位。
# ZK_ENABLED=false 可完全关闭；ZooKeeper 未连接时自动降级为数据库直接更新。
zookeeper.enabled=${ZK_ENABLED:true}
zookeeper.connect-string=${ZK_CONNECT:localhost:2181}
zookeeper.session-timeout-ms=60000
zookeeper.connection-timeout-ms=15000

